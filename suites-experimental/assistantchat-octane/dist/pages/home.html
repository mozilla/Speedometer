<script>// The page runtime: the first inline script of the page. It is the only
// contract between the page and the benchmark harness that writes the page
// into its frame (harness/navigation.mjs), and works the same when the page
// is opened on its own.
//
// window.__chat (first-party code):
//   signal(name, detail)  announces a milestone ("page-hydrated",
//                         "reply-complete", ...) as a "chat:<name>" event and
//                         to the harness.
//   track(promise)        counts the promise as pending work for whenIdle().
//   afterTask(callback)   runs callback in a task of its own.
//   onFlush(callback)     registers a completion that a real page leaves to
//                         a timer or an animationend/transitionend event; the
//                         harness runs them at the end of each step.
//   flush()               runs and clears the registered completions.
//   whenIdle()            resolves once nothing is pending.
//   now                   the frozen clock's "now", in ms since the epoch.
//
// fetch() is wrapped. GET requests for a URL the harness preloaded are
// answered from memory in a task of their own. POST requests to the
// conversation endpoint get a streamed Response whose body enqueues one
// NDJSON line per task, from the next preloaded reply stream; the other API
// endpoints answer with canned JSON. Every request is tracked.
// navigator.clipboard.write/writeText and navigator.sendBeacon are replaced
// by sinks that still receive their arguments.
(function () {
    "use strict";
    var harness = null;
    try {
        harness = window.parent !== window ? window.parent.__chatHarness || null : null;
    } catch (e) {}

    var pending = new Set();
    var origins = harness && harness.debug ? new Map() : null;
    var flushes = [];
    var version = 0;
    var queue = [];
    var channel = new MessageChannel();
    channel.port1.onmessage = function () {
        var callback = queue.shift();
        if (callback)
            callback();
    };

    function afterTask(callback) {
        queue.push(callback);
        channel.port2.postMessage(null);
    }

    function nextTask() {
        return new Promise(afterTask);
    }

    function track(promise) {
        pending.add(promise);
        version++;
        if (origins)
            origins.set(promise, new Error().stack);
        var done = function () {
            pending.delete(promise);
            if (origins)
                origins.delete(promise);
        };
        promise.then(done, done);
        return promise;
    }

    function signal(name, detail) {
        window.dispatchEvent(new CustomEvent("chat:" + name, { detail: detail }));
        if (harness)
            harness.onSignal(name, detail, window);
    }

    function onFlush(callback) {
        flushes.push(callback);
        version++;
    }

    function flush() {
        while (flushes.length) {
            var batch = flushes;
            flushes = [];
            for (var i = 0; i < batch.length; i++)
                batch[i]();
        }
    }

    var loaded = new WeakSet();
    function onLoadOrError(event) {
        loaded.add(event.target);
    }
    document.addEventListener("load", onLoadOrError, true);
    document.addEventListener("error", onLoadOrError, true);

    function loadingResources(list) {
        var count = 0;
        var elements = document.querySelectorAll("script[src], link[rel=stylesheet][href]");
        for (var i = 0; i < elements.length; i++) {
            var element = elements[i];
            if (loaded.has(element))
                continue;
            if (element.localName === "link" && element.sheet)
                continue;
            if (element.localName === "script" && element.type === "module" && window.__chatBooted)
                continue;
            count++;
            if (list)
                list.push(element.outerHTML.slice(0, 160));
        }
        return count;
    }

    function delay() {
        return new Promise(function (resolve) {
            setTimeout(resolve, 0);
        });
    }

    // Octane runs its scheduled renders in scheduler.postTask() callbacks at
    // the default priority where the API exists; those queues are separate
    // from timers and messages. A background task runs only once none of
    // them is ready.
    function drainScheduler() {
        var scheduler = window.scheduler;
        if (!scheduler || typeof scheduler.postTask !== "function")
            return Promise.resolve();
        return scheduler.postTask(function () {}, { priority: "background" });
    }

    async function whenIdle() {
        for (;;) {
            var start = version;
            while (pending.size)
                await Promise.allSettled(Array.from(pending));
            await nextTask();
            await delay();
            await drainScheduler();
            await nextTask();
            if (loadingResources()) {
                await delay();
                continue;
            }
            if (!pending.size && version === start)
                return;
        }
    }

    var API_JSON = {
        "api/conversation/prepare": { ok: true, conduit: "c-7f3a91", model: "lumen-small", features: { search: false, canvas: false } },
        "api/conversation/requirements": { persona: "anonymous", proof: { required: false }, token: "rq-2c9e4b17a0" },
        "api/telemetry": { accepted: true },
    };

    var replies = harness ? null : [];
    var replyIndex = 0;
    function nextReplyLines() {
        var lines = harness ? harness.replyStream(replyIndex) : replies[replyIndex];
        replyIndex++;
        return lines || [];
    }

    function streamResponse(lines) {
        var encoder = new TextEncoder();
        var index = 0;
        var body = new ReadableStream({
            pull: function (controller) {
                return new Promise(function (resolve) {
                    afterTask(function () {
                        if (index < lines.length)
                            controller.enqueue(encoder.encode(lines[index++] + "\n"));
                        else
                            controller.close();
                        resolve();
                    });
                });
            },
        });
        return new Response(body, { status: 200, headers: { "content-type": "application/x-ndjson" } });
    }

    function apiPath(url) {
        var base = new URL(".", document.baseURI).href;
        return url.indexOf(base) === 0 ? url.slice(base.length).split("?")[0] : null;
    }

    var nativeFetch = window.fetch.bind(window);
    window.fetch = function (input, init) {
        var method = ((init && init.method) || (input instanceof Request ? input.method : "GET")).toUpperCase();
        var url = new URL(input instanceof Request ? input.url : String(input), document.baseURI).href;
        var path = apiPath(url);
        if (method === "POST" && path === "api/conversation") {
            var lines = nextReplyLines();
            return track(new Promise(function (resolve) {
                afterTask(function () {
                    resolve(streamResponse(lines));
                });
            }));
        }
        if (path && API_JSON[path]) {
            var json = JSON.stringify(API_JSON[path]);
            return track(new Promise(function (resolve) {
                afterTask(function () {
                    resolve(new Response(json, { status: 200, headers: { "content-type": "application/json" } }));
                });
            }));
        }
        var text = harness && method === "GET" ? harness.response(url) : undefined;
        if (text === undefined)
            return track(nativeFetch(input, init));
        return track(new Promise(function (resolve) {
            afterTask(function () {
                resolve(new Response(text, { status: 200, headers: { "content-type": url.endsWith(".json") ? "application/json" : "text/plain" } }));
            });
        }));
    };

    var clipboard = [];
    var clipboardSink = {
        write: function (items) {
            clipboard.push(items);
            return Promise.all(items.map(function (item) {
                return Promise.all(item.types.map(function (type) {
                    return item.getType(type);
                }));
            })).then(function () {});
        },
        writeText: function (text) {
            clipboard.push(text);
            return Promise.resolve();
        },
        readText: function () {
            return Promise.resolve("");
        },
    };
    try {
        Object.defineProperty(navigator, "clipboard", { configurable: true, get: function () {
            return clipboardSink;
        } });
    } catch (e) {}

    var beacons = 0;
    navigator.sendBeacon = function (url, data) {
        beacons += data ? String(data.length || data.size || 0).length : 0;
        return true;
    };

    window.__chat = {
        hosted: !!harness,
        benchmark: !!harness,
        now: Date.UTC(2026, 10, 2, 9, 30, 0),
        signal: signal,
        track: track,
        afterTask: afterTask,
        nextTask: nextTask,
        onFlush: onFlush,
        flush: flush,
        whenIdle: whenIdle,
        // Standalone pages fetch their reply streams themselves.
        setReplies: function (list) {
            replies = list;
        },
        clipboard: clipboard,
        debugIdle: function () {
            var resources = [];
            loadingResources(resources);
            return { pending: pending.size, flushes: flushes.length, origins: origins ? Array.from(origins.values()) : null, resources: resources, beacons: beacons };
        },
    };
})();
</script>
